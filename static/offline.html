<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Offline | OpenCoach</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		body {
			font-family: 'Nunito', system-ui, sans-serif;
			background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
			color: #e2e8f0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 2rem;
		}
		.container {
			text-align: center;
			max-width: 400px;
		}
		.icon {
			font-size: 4rem;
			margin-bottom: 1.5rem;
		}
		h1 {
			font-family: 'Outfit', system-ui, sans-serif;
			font-size: 1.75rem;
			margin-bottom: 1rem;
			color: #fff;
		}
		p {
			color: #94a3b8;
			line-height: 1.6;
			margin-bottom: 2rem;
		}
		.btn {
			display: inline-block;
			padding: 0.75rem 1.5rem;
			background: #22c55e;
			color: #fff;
			text-decoration: none;
			border-radius: 0.5rem;
			font-weight: 600;
			transition: background 0.2s;
		}
		.btn:hover {
			background: #16a34a;
		}
		.tip {
			margin-top: 2rem;
			padding: 1rem;
			background: rgba(255,255,255,0.05);
			border-radius: 0.75rem;
			font-size: 0.9rem;
		}
		.tip-title {
			color: #22c55e;
			font-weight: 600;
			margin-bottom: 0.5rem;
		}
	</style>
</head>
<body>
	<div class="container">
		<div class="icon">📡</div>
		<h1>You're Offline</h1>
		<p>
			Can't reach OpenCoach right now. Check your internet connection and try again.
		</p>
		<a href="/" class="btn" onclick="location.reload(); return false;">Try Again</a>
		
		<div class="tip">
			<div class="tip-title">💡 Tip</div>
			While you're offline, go for that run anyway! 
			Your watch will sync when you're back online.
		</div>
	</div>
</body>
</html>
