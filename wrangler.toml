name = "opencoach"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "opencoach-db"
database_id = "YOUR_ID_HERE"

# OpenRouter AI Configuration
# Set these via `wrangler secret put OPENROUTER_API_KEY` for production
# Or in .dev.vars for local development
[vars]
OPENROUTER_MODEL = "anthropic/claude-3.5-haiku"

# Email Workers binding for sending notifications
# Requires Email Routing enabled on your domain
# See: https://developers.cloudflare.com/email-routing/email-workers/send-email-workers/
# Uncomment and configure once you have Email Routing set up:
# [[send_email]]
# name = "EMAIL"

[triggers]
crons = [
    "0 */4 * * *",  # Sync loop (Every 4 hours)
    "0 7 * * *",    # Morning reminder + Rescheduler (7 AM)
    "0 20 * * *",   # Evening reminder (8 PM daily)
    "0 20 * * 0"    # Planner (Sunday 8 PM)
]
