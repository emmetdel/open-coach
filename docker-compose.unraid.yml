# OpenCoach - Unraid Docker Compose
# Uses pre-built image from GitHub Container Registry
#
# Usage:
# 1. Copy this file to your Unraid server
# 2. Create a .env file with your settings (see below)
# 3. Run: docker-compose -f docker-compose.unraid.yml up -d
#
# Required .env variables:
#   GARMIN_EMAIL=your@email.com
#   GARMIN_PASSWORD=yourpassword
#   OPENROUTER_API_KEY=sk-or-v1-...
#
# Optional .env variables:
#   BASE_URL=https://opencoach.yourdomain.com
#   OPENROUTER_MODEL=anthropic/claude-sonnet-4

services:
  opencoach:
    image: ghcr.io/emmetdel/open-coach:latest
    container_name: opencoach
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persist database - adjust path as needed for Unraid
      - /mnt/user/appdata/opencoach:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
      - DATABASE_PATH=/app/data/opencoach.db
      - ENABLE_CRON=true
      - BASE_URL=${BASE_URL:-http://localhost:3000}
      # Garmin credentials
      - GARMIN_EMAIL=${GARMIN_EMAIL}
      - GARMIN_PASSWORD=${GARMIN_PASSWORD}
      # OpenRouter AI
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-anthropic/claude-sonnet-4}
    labels:
      # Watchtower auto-update (if you use Watchtower)
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

